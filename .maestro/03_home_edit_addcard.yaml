# Home shell interaction. Needs an app that is past onboarding, so in CI it runs
# after 02_onboarding.yaml; on your own device it just works. No backend required:
# toggling Edit mode reveals the "Add card" FAB purely from local UI state.
appId: org.phioster.nexarr
name: Home edit mode and Add card
---
- launchApp
# Edit action in the top bar (contentDescription "Edit").
- tapOn: "Edit"
- assertVisible: "Add card"
- takeScreenshot: 02_edit_mode
# Open the drawer (nav icon contentDescription "Services") to confirm the service list.
- tapOn: "Services"
- takeScreenshot: 02_drawer
