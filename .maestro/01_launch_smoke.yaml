# Launch smoke test, runs anywhere: fresh install or a configured device.
# Proves the app process starts, the first frame renders and nothing crashes on boot.
# The regex matches either the onboarding screen (fresh install) or the home shell.
appId: org.phioster.nexarr
name: Launch smoke
