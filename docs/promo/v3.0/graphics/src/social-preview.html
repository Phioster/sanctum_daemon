<!doctype html>
<html><head><meta charset="utf-8"><title>Sanctumd social preview</title>
<link rel="stylesheet" href="common.css">
<style>
  .stage { width: 1280px; height: 640px; }
  .left { position: absolute; left: 64px; top: 56px; width: 700px; z-index: 2; }
  .left img.icon { width: 104px; height: 104px; border-radius: 22px; box-shadow: 0 0 30px rgba(0,255,65,.25); }
  .prompt { font-size: 21px; margin-top: 18px; }
  .title { font-size: 80px; line-height: 1.05; margin-top: 6px; white-space: nowrap; }
  .title .v { font-size: 40px; letter-spacing: .04em; vertical-align: super; margin-left: 26px;
    border: 2px solid var(--border); padding: 2px 10px; text-shadow: none; }
  .cursor { width: 36px; height: 64px; margin-left: 8px; }
  .line { font-size: 30px; margin-top: 20px; color: #c8ffd6; }
  .svc { font-size: 19px; margin-top: 16px; color: var(--dim); }
  .foot { position: absolute; left: 64px; bottom: 34px; font-size: 18px; color: var(--dim); z-index: 2; }
  .phone { position: absolute; width: 262px; height: 548px; }
  .p1 { right: 238px; top: 70px; transform: rotate(-4deg); }
  .p2 { right: 40px; top: 30px; transform: rotate(3deg); }
</style></head>
<body><div class="stage">
  <div class="rain" style="-webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.35) 50%, #000 75%)"></div>
  <div class="left">
    <img class="icon" src="../../../../icon.png" alt="">
    <div class="prompt">visitor@homelab:~$ ./sanctumd --version</div>
    <div class="title">SANCTUMD<span class="cursor"></span><span class="v">3.0</span></div>
    <div class="line">Your whole media stack,<br>in one Android app.</div>
    <div class="svc">Jellyfin · Radarr · Sonarr · Lidarr<br>Prowlarr · Seerr · NZBGet · ntfy</div>
  </div>
  <div class="foot">[OK] no backend &nbsp; [OK] demo mode &nbsp; [OK] GPL-3.0</div>
  <div class="phone p1"><img src="../../../../screenshots/services.png" alt=""></div>
  <div class="phone p2"><img src="../../../../screenshots/home-calendar.png" alt=""></div>
</div>
<script src="rain.js"></script>
</body></html>
