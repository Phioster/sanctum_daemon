name: "✨ Feature request"
description: Suggest an idea or improvement for Sanctumd
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this hasn't been requested.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard / widgets
        - Jellyfin
        - Radarr / Sonarr / Lidarr
        - Prowlarr
        - Seerr (Jellyseerr)
        - NZBGet
        - Notifications / ntfy
        - New service integration
        - Theming / UX
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that's awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / context
      description: Anything else, mockups, similar apps, related requests.
    validations:
      required: false
