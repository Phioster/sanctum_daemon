name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Without this the action installs its default 'tools' package, which Google removed
          # from the SDK repository, sdkmanager then exits 1 and the whole job dies.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Robolectric fetches its android-all runtime from Maven the first time a test needs it --
      # at test time, not at build time. A hiccup there fails the run with an IOException and
      # nothing to do with the code (it happened once already), so the download is kept.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      # Flavour-qualified task names: with productFlavors there is no plain `testDebugUnitTest`.
      # The two flavours share every source file, so testing one variant covers the code; the tv
      # variant's compilation is still checked by assembleDebug below.
      - name: Unit tests
        run: gradle testPhoneDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          retention-days: 1
          path: app/build/reports/tests/

      - name: Static analysis (detekt)
        run: gradle detekt --no-daemon --stacktrace

      - name: Android Lint
        run: gradle lintPhoneDebug --no-daemon --stacktrace

      # Always, not just on failure: Lint is report-only (abortOnError = false in
      # app/build.gradle.kts), so it never fails the build and the report was being
      # thrown away every single time. Nobody can act on a report nobody sees.
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          retention-days: 1
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-*.*
          if-no-files-found: warn

      # Compiles the debug variant as a build-health check. The APK itself is NOT uploaded, we never
      # install it (debug key ≠ release key; installs come from release.yml), so keeping it only ate
      # into the 0.5 GB free Actions-storage quota.
      - name: Build debug APKs (phone + tv)
        run: gradle assembleDebug --no-daemon --stacktrace
