name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Without this the action installs its default 'tools' package, which Google removed
          # from the SDK repository — sdkmanager then exits 1 and the whole job dies.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          retention-days: 1
          path: app/build/reports/tests/

      - name: Static analysis (detekt)
        run: gradle detekt --no-daemon --stacktrace

      - name: Android Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Upload analysis reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          retention-days: 1
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-*.*
          if-no-files-found: warn

      # Compiles the debug variant as a build-health check. The APK itself is NOT uploaded — we never
      # install it (debug key ≠ release key; installs come from release.yml), so keeping it only ate
      # into the 0.5 GB free Actions-storage quota.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
