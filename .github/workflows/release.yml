name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Without this the action installs its default 'tools' package, which Google removed
          # from the SDK repository — sdkmanager then exits 1 and the whole job dies.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — add the signing secrets first."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Robolectric fetches its android-all runtime from Maven the first time a test needs it --
      # at test time, not at build time. A hiccup there fails the run with an IOException and
      # nothing to do with the code (it happened once already), so the download is kept.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Unit tests
        run: gradle testPhoneDebugUnitTest --no-daemon

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # assembleRelease builds both flavours; each gets its own asset name so the TV client and
      # the phone console never get mistaken for one another on the release page.
      - name: Stage APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/phone/release/app-phone-release.apk "out/sanctumd-${GITHUB_REF_NAME:-manual}.apk"
          cp app/build/outputs/apk/tv/release/app-tv-release.apk "out/sanctumd-tv-${GITHUB_REF_NAME:-manual}.apk"

      # Best-effort artifact upload. Non-fatal: the free Actions-storage quota can block uploads
      # (and lags 6-12 h after cleanup), but the rolling "dev" Release below is the real delivery
      # path — Release assets don't count against the artifact-storage quota.
      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sanctumd-release-apk
          retention-days: 1
          path: out/*.apk
          if-no-files-found: error

      # Rolling single "dev" Release that always holds the latest manual build's APK (replaced each
      # run — one tag, no accumulation). This is what the install loop downloads.
      - name: Publish rolling dev release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: dev build
          prerelease: true
          files: out/*.apk

      # What the release page says, in order of preference: a text written for that tag, else the
      # changelog's newest section. Never the generated list of commit subjects — that is written
      # for whoever maintains the app, not for someone installing it.
      #
      # The per-tag file exists because the two audiences differ on one point: the changelog
      # accounts for a security finding in full, which belongs in the repository, while the front
      # page of a release names the category and points at the changelog for the rest.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -f ".github/release-notes/${GITHUB_REF_NAME}.md" ]; then
            cp ".github/release-notes/${GITHUB_REF_NAME}.md" out/notes.md
          else
            awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > out/notes.md
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: out/notes.md
