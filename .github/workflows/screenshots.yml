name: Screenshots (demo mode)

# Takes the release screenshots and the demo video from the real debug build on an emulator,
# in demo mode, so nothing private can show. Not a gate: it only runs when the flows or this
# file change, or by hand, and it commits what it captured back to the branch it ran on.
# The pictures come from an emulator (Pixel 5 profile), not a phone; .maestro/screenshots/
# runs unchanged against a real device for that.

on:
  workflow_dispatch:
  push:
    branches-ignore: [master]
    paths:
      - '.maestro/screenshots/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assemblePhoneDebug --no-daemon

      - name: Install maestro and ffmpeg
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Same reason as ui-smoke.yml: the emulator needs more room than the image leaves.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo apt-get clean

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 3
          ram-size: 4096M
          disk-size: 6G
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash .maestro/screenshots/capture.sh

      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/v3.0
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Screenshots aus dem Demo-Modus (Emulator, ${GITHUB_SHA::7})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-raw
          retention-days: 3
          path: |
            shots/**
            ~/.maestro/tests/**
          if-no-files-found: warn
