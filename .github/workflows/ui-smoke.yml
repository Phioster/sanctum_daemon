name: UI smoke (maestro)

# Standalone smoke gate: boots an emulator, installs the debug APK and drives the app
# with maestro. Kept separate from build.yml/release.yml so a flaky emulator run never
# blocks a release.

on:
  workflow_dispatch:
  push:
    paths:
      - '.maestro/**'
      - '.github/workflows/ui-smoke.yml'

jobs:
  smoke:
    name: Launch smoke on emulator
    # Pinned to 22.04: the emulator fails to boot on the newer ubuntu-latest image
    # ("Timeout waiting for emulator to boot"). 22.04 boots the AVD reliably.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Install maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run maestro launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/*.apk
            maestro test .maestro/01_launch_smoke.yaml

      - name: Upload maestro output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          retention-days: 5
          path: |
            ~/.maestro/tests/**
          if-no-files-found: warn
